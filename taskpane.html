<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Công thức</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/mathlive@0.108.0/+esm"></script>
<script src="omml.js"></script>
<style>
  body { font: 14px system-ui; margin: 12px; }
  math-field { width: 100%; font-size: 24px; border: 1px solid #aaa; border-radius: 6px; padding: 6px; }
  button { margin-top: 10px; padding: 8px 14px; font-size: 14px; }
  #msg { margin-top: 8px; color: #b00; }
</style>
</head>
<body>
<math-field id="mf"></math-field>
<button id="ins">Chèn vào Word</button>
<div id="msg"></div>
<script>
  Office.onReady(() => {
    document.getElementById('ins').onclick = async () => {
      const msg = document.getElementById('msg');
      msg.textContent = '';
      try {
        const mathml = document.getElementById('mf').getValue('math-ml');
        const xml = Omml.toPackage(Omml.mathmlToOmml(mathml));
        await Word.run(async ctx => {
          ctx.document.getSelection().insertOoxml(xml, 'Replace');
          await ctx.sync();
        });
      } catch (e) { msg.textContent = e.message; }
    };
  });
</script>
</body>
</html>
